name: Build APK

on:
  push:
    branches: ["claude/**", main]
    paths-ignore: ["pipeline/**", "**/*.md"]
  workflow_dispatch:

permissions:
  contents: write   # needed to publish the APK to a GitHub Release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: camlab-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish to "latest-debug" release (download this on your phone)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-debug
          name: Latest debug build
          prerelease: true
          body: "Auto-built from ${{ github.sha }}. Download app-debug.apk on the phone and install."
          files: app/build/outputs/apk/debug/app-debug.apk
